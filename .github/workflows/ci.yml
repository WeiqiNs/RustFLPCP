name: CI

# Trigger on pushes and pull requests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest

    steps:
      # Check out the repo.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Rust toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Lint with parallel feature
        run: cargo clippy --all --all-targets --features parallel -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with line coverage
        run: cargo llvm-cov --all --fail-uncovered-lines 0
